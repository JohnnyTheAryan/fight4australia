<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generate Admin Password Hash</title>
  <style>body{font-family:system-ui;background:#0a1628;color:#fff;padding:2rem;max-width:480px;margin:auto}input,button{width:100%;padding:0.75rem;margin:0.5rem 0;border-radius:8px;border:1px solid #333;background:#111;color:#fff}button{background:#f59e0b;color:#000;font-weight:700;cursor:pointer}code{display:block;background:#111;padding:1rem;border-radius:8px;word-break:break-all;margin-top:1rem}</style>
</head>
<body>
  <h1>Admin password hash</h1>
  <p>Enter the password you want for the admin account. Copy the hash into the SQL INSERT in SETUP.md.</p>
  <input type="password" id="pw" placeholder="Password">
  <button id="go">Generate SHA-256 hash</button>
  <code id="out"></code>
  <script>
    document.getElementById('go').onclick = async () => {
      const pw = document.getElementById('pw').value;
      if (!pw) return;
      const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
      document.getElementById('out').textContent = [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,'0')).join('');
    };
  </script>
</body>
</html>

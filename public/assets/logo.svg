<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" fill="none">
  <!-- Shield / badge background -->
  <rect x="0" y="2" width="36" height="36" rx="8" fill="url(#grad)"/>
  <!-- Southern Cross simplified -->
  <g fill="#fff" opacity="0.95">
    <circle cx="18" cy="12" r="1.6"/>
    <circle cx="12" cy="20" r="1.3"/>
    <circle cx="24" cy="20" r="1.3"/>
    <circle cx="18" cy="27" r="1.1"/>
    <circle cx="18" cy="20" r="1.8"/>
  </g>
  <!-- FFA text -->
  <text x="44" y="26" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="18" fill="#fbbf24" letter-spacing="-0.5">FFA</text>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="36" y2="36">
      <stop stop-color="#00843D"/>
      <stop offset="0.55" stop-color="#006b32"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
